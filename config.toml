baseURL = "https://incomeforeveryone.org/"
languageCode = "en-us"
title = "Income For Everyone"
theme = "PaperMod"

[outputs]
  home = ["HTML", "RSS", "AIJOBSBRIEF", "JSONFEED"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[outputFormats.AIJOBSBRIEF]
  mediaType = "application/rss+xml"
  baseName = "ai-jobs-brief"
  notAlternative = true

[mediaTypes."application/feed+json"]
  suffixes = ["json"]

[outputFormats.JSONFEED]
  mediaType = "application/feed+json"
  baseName = "feed"
  notAlternative = true

[pagination]
  pagerSize = 8

[params]
  env = "production"
  defaultTheme = "light"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPageNums = true
  DateFormat = "January 2, 2006"
  description = "News-led daily briefs on AI, automation, job disruption, labor policy, and Universal Basic Income."
  mainSections = ["posts"]
  newsletterSignupURL = "https://db30afbf.sibforms.com/serve/MUIFACwt01p-doJUQuyiUSiTnxZv0XjVAfPXF4DIaQtM95AKyex0Xyx1BSqW4bc5T2iUCE9FXihi0-B46VUhi3cVb7nTA0j9OUMktabqbzdmtVocZHmP_d_4EtRI9Uf9H7h-7Dx_l7f4GHGw75yvoj0U3VrRWXpiG1dfvu3VIeEwLzJxHpJpyJJ1mi8-j9KxDAdHhjvEYno2d2Jojg=="

[params.homeInfoParams]
  Title = "How AI is changing work"
  Content = "Daily briefs on jobs, automation, and income security."

[params.assets]
  favicon = "/favicon.svg"

[[menu.main]]
  identifier = "posts"
  name = "Briefs"
  url = "/posts/"
  weight = 1

[[menu.main]]
