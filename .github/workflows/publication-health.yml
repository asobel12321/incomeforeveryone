name: Publication health

on:
  workflow_dispatch:
  schedule:
    - cron: "45 21 * * *"

permissions:
  contents: read

concurrency:
  group: publication-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check deployed content and X publication record
        run: python scripts/check_publication_health.py
