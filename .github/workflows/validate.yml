name: Validate changes

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'content/posts/**'
      - 'data/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: true
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: npm ci
      - run: npm run check:functions
      - run: npm run check:x402
      - run: hugo --destination "$RUNNER_TEMP/hugo-validation"
      - run: python scripts/check_site_output.py --site-dir "$RUNNER_TEMP/hugo-validation"
