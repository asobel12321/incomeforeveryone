name: Daily AI Labor Watch

on:
  schedule:
    - cron: "15 14 * * *"
  workflow_call:
    inputs:
      date:
        description: "Post date as YYYY-MM-DD. Defaults to today in New York."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      preview:
        description: "Generate and build an unsent preview artifact without committing."
        required: false
        type: boolean
        default: false
      date:
        description: "Post date as YYYY-MM-DD. Defaults to today in New York."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-ai-labor-watch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.145.0"
          extended: true

      - name: Resolve edition date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          edition_date="${REQUESTED_DATE:-$(TZ=America/New_York date +%F)}"
          python -c 'import datetime, re, sys; value = sys.argv[1]; assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", value); datetime.date.fromisoformat(value)' "$edition_date"
          echo "EDITION_DATE=$edition_date" >> "$GITHUB_ENV"

      - name: Generate daily post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
        run: |
          python scripts/generate_daily_post.py --date "$EDITION_DATE"

      - name: Generate short video script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
        run: |
          python scripts/generate_video_script.py --date "$EDITION_DATE" --model "$OPENAI_MODEL"

      - name: Build site
        run: hugo --destination "$RUNNER_TEMP/hugo-validation"

      - name: Commit and push post
        if: github.ref == 'refs/heads/main' && !inputs.preview
        run: |
          if [ -z "$(git status --porcelain -- content/posts)" ]; then
            echo "No new post to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          git commit -m "Add daily AI labor watch"
          git pull --rebase origin main
          git push

      - name: Save generated preview
        if: inputs.preview || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: daily-preview-${{ env.EDITION_DATE }}
          path: content/posts/${{ env.EDITION_DATE }}.md
          if-no-files-found: error
