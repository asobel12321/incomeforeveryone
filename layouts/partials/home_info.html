{{- $latestURL := "/posts/" | relURL }}
{{- range .latest }}{{ $latestURL = .RelPermalink }}{{ end }}
{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info publication-hero">
    <header class="entry-header">
        <h1>{{ .Title | markdownify }}</h1>
    </header>
    <div class="entry-content">
        {{ .Content | markdownify }}
    </div>
    <div class="hero-actions" aria-label="Primary links">
        <a class="hero-button hero-button-primary" href="{{ $latestURL }}">Read the latest brief</a>
        <a class="hero-button" href="{{ "/newsletter/" | relURL }}">Subscribe</a>
    </div>
</article>
{{- end -}}
